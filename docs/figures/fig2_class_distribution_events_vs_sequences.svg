<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 480" width="100%" height="100%" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <!-- Header -->
  <rect x="0" y="0" width="850" height="60" fill="#0f172a"/>
  <text x="30" y="38" fill="#f8fafc" font-size="20" font-weight="700">Figure 2: Four-Sensor Dataset Class Distribution &amp; Severe Minority Imbalance</text>
  
  <text x="30" y="85" fill="#64748b" font-size="13">Comparison of Raw Events (N = 3,090) and Sliding Window Sequences (N = 2,730, L = 16)</text>

  <!-- Legend -->
  <rect x="520" y="70" width="18" height="18" rx="3" fill="#2563eb"/>
  <text x="545" y="84" fill="#334155" font-size="12" font-weight="600">Total Raw Events (3,090)</text>
  <rect x="680" y="70" width="18" height="18" rx="3" fill="#06b6d4"/>
  <text x="705" y="84" fill="#334155" font-size="12" font-weight="600">Sequences (2,730)</text>

  <!-- Y-Axis Gridlines (Log / Scaled representation for visual clarity) -->
  <line x1="140" y1="120" x2="800" y2="120" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="140" y1="180" x2="800" y2="180" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="140" y1="240" x2="800" y2="240" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="140" y1="300" x2="800" y2="300" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="140" y1="380" x2="800" y2="380" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Class Rows (Horizontal Layout for Readability) -->
  
  <!-- Row 1: Normal -->
  <text x="130" y="145" fill="#1e293b" font-size="12" font-weight="700" text-anchor="end">Normal</text>
  <rect x="140" y="130" width="534" height="14" rx="2" fill="#2563eb"/>
  <text x="684" y="142" fill="#2563eb" font-size="11" font-weight="600">2,671 (86.4%)</text>
  <rect x="140" y="148" width="462" height="14" rx="2" fill="#06b6d4"/>
  <text x="612" y="160" fill="#0891b2" font-size="11" font-weight="600">2,311 (84.6%)</text>

  <!-- Row 2: DoS -->
  <text x="130" y="195" fill="#1e293b" font-size="12" font-weight="700" text-anchor="end">DoS</text>
  <rect x="140" y="180" width="63" height="14" rx="2" fill="#2563eb"/>
  <text x="213" y="192" fill="#2563eb" font-size="11" font-weight="600">316 (10.2%)</text>
  <rect x="140" y="198" width="63" height="14" rx="2" fill="#06b6d4"/>
  <text x="213" y="210" fill="#0891b2" font-size="11" font-weight="600">316 (11.6%)</text>

  <!-- Row 3: Identity Spoofing -->
  <text x="130" y="245" fill="#1e293b" font-size="12" font-weight="700" text-anchor="end">IdentitySpoofing</text>
  <rect x="140" y="230" width="18" height="14" rx="2" fill="#2563eb"/>
  <text x="168" y="242" fill="#2563eb" font-size="11" font-weight="600">41 (1.33%)</text>
  <rect x="140" y="248" width="18" height="14" rx="2" fill="#06b6d4"/>
  <text x="168" y="260" fill="#0891b2" font-size="11" font-weight="600">41 (1.50%)</text>

  <!-- Row 4: Delay -->
  <text x="130" y="295" fill="#1e293b" font-size="12" font-weight="700" text-anchor="end">Delay</text>
  <rect x="140" y="280" width="10" height="14" rx="2" fill="#2563eb"/>
  <text x="160" y="292" fill="#2563eb" font-size="11" font-weight="600">18 (0.58%)</text>
  <rect x="140" y="298" width="10" height="14" rx="2" fill="#06b6d4"/>
  <text x="160" y="310" fill="#0891b2" font-size="11" font-weight="600">18 (0.66%)</text>

  <!-- Row 5: Data Falsification -->
  <text x="130" y="340" fill="#1e293b" font-size="12" font-weight="700" text-anchor="end">DataFalsification</text>
  <rect x="140" y="325" width="10" height="14" rx="2" fill="#2563eb"/>
  <text x="160" y="337" fill="#2563eb" font-size="11" font-weight="600">18 (0.58%)</text>
  <rect x="140" y="343" width="10" height="14" rx="2" fill="#06b6d4"/>
  <text x="160" y="355" fill="#0891b2" font-size="11" font-weight="600">18 (0.66%)</text>

  <!-- Row 6: MITM -->
  <text x="130" y="385" fill="#1e293b" font-size="12" font-weight="700" text-anchor="end">MITM</text>
  <rect x="140" y="370" width="8" height="14" rx="2" fill="#2563eb"/>
  <text x="158" y="382" fill="#2563eb" font-size="11" font-weight="600">15 (0.49%)</text>
  <rect x="140" y="388" width="8" height="14" rx="2" fill="#06b6d4"/>
  <text x="158" y="400" fill="#0891b2" font-size="11" font-weight="600">15 (0.55%)</text>

  <!-- Row 7: Replay -->
  <text x="130" y="430" fill="#1e293b" font-size="12" font-weight="700" text-anchor="end">Replay</text>
  <rect x="140" y="415" width="6" height="14" rx="2" fill="#2563eb"/>
  <text x="156" y="427" fill="#2563eb" font-size="11" font-weight="600">11 (0.36%)</text>
  <rect x="140" y="433" width="6" height="14" rx="2" fill="#06b6d4"/>
  <text x="156" y="445" fill="#0891b2" font-size="11" font-weight="600">11 (0.40%)</text>

  <!-- Callout box for Academic Notice -->
  <rect x="420" y="270" width="390" height="130" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="435" y="295" fill="#b91c1c" font-size="12" font-weight="700">ACUTE MINORITY IMBALANCE OBSERVATION:</text>
  <text x="435" y="318" fill="#475569" font-size="11">• Normal + DoS constitute 96.67% of all dataset traffic.</text>
  <text x="435" y="338" fill="#475569" font-size="11">• Replay, MITM, Delay, DataFalsification total only 62 events (2.0%).</text>
  <text x="435" y="358" fill="#475569" font-size="11">• Justifies Two-Tier Architecture: Formal TFSM acts as a deterministic</text>
  <text x="435" y="378" fill="#475569" font-size="11">   safety net where empirical deep learning suffers from sample scarcity.</text>
</svg>
