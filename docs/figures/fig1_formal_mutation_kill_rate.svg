<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <!-- Header -->
  <rect x="0" y="0" width="800" height="60" fill="#1e293b"/>
  <text x="30" y="38" fill="#f8fafc" font-size="20" font-weight="700">Figure 1: Formal TFSM Mutation Kill Rate Across Four IoT Sensors</text>
  
  <!-- Subtitle -->
  <text x="30" y="85" fill="#64748b" font-size="13">Mutation Verification Target: 100% Kill Rate (59 / 59 Mutants Killed by Specific Test Sequences)</text>

  <!-- Grid lines -->
  <line x1="120" y1="120" x2="720" y2="120" stroke="#e2e8f0" stroke-width="1"/>
  <text x="105" y="125" fill="#94a3b8" font-size="12" text-anchor="end">100%</text>

  <line x1="120" y1="180" x2="720" y2="180" stroke="#e2e8f0" stroke-width="1"/>
  <text x="105" y="185" fill="#94a3b8" font-size="12" text-anchor="end">75%</text>

  <line x1="120" y1="240" x2="720" y2="240" stroke="#e2e8f0" stroke-width="1"/>
  <text x="105" y="245" fill="#94a3b8" font-size="12" text-anchor="end">50%</text>

  <line x1="120" y1="300" x2="720" y2="300" stroke="#e2e8f0" stroke-width="1"/>
  <text x="105" y="305" fill="#94a3b8" font-size="12" text-anchor="end">25%</text>

  <line x1="120" y1="360" x2="720" y2="360" stroke="#cbd5e1" stroke-width="2"/>
  <text x="105" y="365" fill="#94a3b8" font-size="12" text-anchor="end">0%</text>

  <!-- Bars (Height = 240px for 100%) -->
  <!-- Bar 1: Motion -->
  <rect x="160" y="120" width="85" height="240" rx="4" fill="#0284c7"/>
  <text x="202" y="110" fill="#0369a1" font-size="13" font-weight="700" text-anchor="middle">100% (14/14)</text>
  <text x="202" y="380" fill="#334155" font-size="13" font-weight="600" text-anchor="middle">Motion Sensor</text>
  <text x="202" y="398" fill="#64748b" font-size="11" text-anchor="middle">PIR Occupancy</text>

  <!-- Bar 2: Temperature -->
  <rect x="280" y="120" width="85" height="240" rx="4" fill="#0d9488"/>
  <text x="322" y="110" fill="#0f766e" font-size="13" font-weight="700" text-anchor="middle">100% (15/15)</text>
  <text x="322" y="380" fill="#334155" font-size="13" font-weight="600" text-anchor="middle">Temperature</text>
  <text x="322" y="398" fill="#64748b" font-size="11" text-anchor="middle">Periodic Telemetry</text>

  <!-- Bar 3: Ultrasonic -->
  <rect x="400" y="120" width="85" height="240" rx="4" fill="#6366f1"/>
  <text x="442" y="110" fill="#4338ca" font-size="13" font-weight="700" text-anchor="middle">100% (15/15)</text>
  <text x="442" y="380" fill="#334155" font-size="13" font-weight="600" text-anchor="middle">Ultrasonic</text>
  <text x="442" y="398" fill="#64748b" font-size="11" text-anchor="middle">Distance Ranging</text>

  <!-- Bar 4: RFID -->
  <rect x="520" y="120" width="85" height="240" rx="4" fill="#8b5cf6"/>
  <text x="562" y="110" fill="#6d28d9" font-size="13" font-weight="700" text-anchor="middle">100% (15/15)</text>
  <text x="562" y="380" fill="#334155" font-size="13" font-weight="600" text-anchor="middle">RFID Reader</text>
  <text x="562" y="398" fill="#64748b" font-size="11" text-anchor="middle">Access Credentials</text>

  <!-- Bar 5: Combined Total -->
  <rect x="640" y="120" width="65" height="240" rx="4" fill="#10b981"/>
  <text x="672" y="110" fill="#047857" font-size="13" font-weight="700" text-anchor="middle">100% (59/59)</text>
  <text x="672" y="380" fill="#047857" font-size="13" font-weight="700" text-anchor="middle">Total System</text>
  <text x="672" y="398" fill="#047857" font-size="11" text-anchor="middle">All Mutants</text>

  <!-- Footer caption -->
  <rect x="0" y="420" width="800" height="30" fill="#f8fafc"/>
  <text x="400" y="440" fill="#94a3b8" font-size="11" text-anchor="middle">Execution: python -m models_fsm.verify | Deterministic formal conformance testing</text>
</svg>
