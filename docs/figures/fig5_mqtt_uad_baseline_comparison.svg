  <rect x="390" y="425" width="14" height="14" rx="2" fill="#3b82f6"/>
  <text x="410" y="436" fill="#1d4ed8" font-size="11">Stage 3B.6 RF_tuned</text>
  <rect x="560" y="425" width="14" height="14" rx="2" fill="#10b981"/>
  <text x="580" y="436" fill="#047857" font-size="11">Stage 3B.6 HistGB_tuned</text>
