  <!-- Group 1: Full-Stream 4-Class -->
  <!-- Base RF: 0.6098 (height = 146px -> y = 214) -->
  <rect x="130" y="214" width="40" height="146" rx="3" fill="#94a3b8"/>
  <text x="150" y="206" fill="#64748b" font-size="10" font-weight="600" text-anchor="middle">0.6098</text>

  <!-- Tuned RF: 0.6889 (height = 165px -> y = 195) -->
  <rect x="175" y="195" width="40" height="165" rx="3" fill="#3b82f6"/>
  <text x="195" y="187" fill="#1d4ed8" font-size="10" font-weight="600" text-anchor="middle">0.6889</text>

  <!-- HistGB: 0.6975 (height = 167px -> y = 193) -->
  <rect x="220" y="193" width="40" height="167" rx="3" fill="#10b981"/>
  <text x="240" y="185" fill="#047857" font-size="10" font-weight="700" text-anchor="middle">0.6975</text>

  <text x="195" y="380" fill="#1e293b" font-size="12" font-weight="700" text-anchor="middle">Full Stream 4-Class</text>
  <text x="195" y="396" fill="#64748b" font-size="10" text-anchor="middle">(33 Features, N = 42,931 test)</text>

