  <line x1="100" y1="120" x2="800" y2="120" stroke="#f1f5f9" stroke-width="1"/>
  <text x="85" y="125" fill="#94a3b8" font-size="11" text-anchor="end">1.00</text>

  <line x1="100" y1="180" x2="800" y2="180" stroke="#f1f5f9" stroke-width="1"/>
  <text x="85" y="185" fill="#94a3b8" font-size="11" text-anchor="end">0.75</text>

  <line x1="100" y1="240" x2="800" y2="240" stroke="#f1f5f9" stroke-width="1"/>
  <text x="85" y="245" fill="#94a3b8" font-size="11" text-anchor="end">0.50</text>

  <line x1="100" y1="300" x2="800" y2="300" stroke="#f1f5f9" stroke-width="1"/>
  <text x="85" y="305" fill="#94a3b8" font-size="11" text-anchor="end">0.25</text>

  <line x1="100" y1="360" x2="800" y2="360" stroke="#cbd5e1" stroke-width="2"/>
