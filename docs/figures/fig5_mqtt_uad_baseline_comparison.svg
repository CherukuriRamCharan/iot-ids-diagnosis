  <!-- Group 4: MQTT-Only Binary -->
  <!-- Base RF: 0.9776 -->
  <rect x="670" y="126" width="40" height="234" rx="3" fill="#94a3b8"/>
  <text x="690" y="118" fill="#64748b" font-size="10" font-weight="600" text-anchor="middle">0.9776</text>

  <!-- Tuned RF: 0.9783 -->
  <rect x="715" y="125" width="40" height="235" rx="3" fill="#3b82f6"/>
  <text x="735" y="117" fill="#1d4ed8" font-size="10" font-weight="600" text-anchor="middle">0.9783</text>

  <!-- Tuned HistGB: 0.9780 -->
  <rect x="760" y="125" width="40" height="235" rx="3" fill="#10b981"/>
  <text x="780" y="117" fill="#047857" font-size="10" font-weight="600" text-anchor="middle">0.9780</text>

  <text x="735" y="380" fill="#1e293b" font-size="12" font-weight="700" text-anchor="middle">MQTT-Only Binary</text>
  <text x="735" y="396" fill="#64748b" font-size="10" text-anchor="middle">(N = 6,273 test)</text>

