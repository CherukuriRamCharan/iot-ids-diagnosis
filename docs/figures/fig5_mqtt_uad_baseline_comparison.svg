  <!-- Tuned RF: 0.9818 (height = 235px -> y = 125) -->
  <rect x="355" y="125" width="40" height="235" rx="3" fill="#3b82f6"/>
  <text x="375" y="117" fill="#1d4ed8" font-size="10" font-weight="600" text-anchor="middle">0.9818</text>

  <!-- HistGB: 0.9833 (height = 236px -> y = 124) -->
  <rect x="400" y="124" width="40" height="236" rx="3" fill="#10b981"/>
  <text x="420" y="116" fill="#047857" font-size="10" font-weight="700" text-anchor="middle">0.9833</text>

  <text x="375" y="380" fill="#1e293b" font-size="12" font-weight="700" text-anchor="middle">Full Stream Binary</text>
  <text x="375" y="396" fill="#64748b" font-size="10" text-anchor="middle">(Detection Normal vs Attack)</text>

