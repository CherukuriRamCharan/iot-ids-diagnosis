  <!-- Base RF: 0.6899 (height = 165px -> y = 195) -->
  <rect x="490" y="195" width="40" height="165" rx="3" fill="#94a3b8"/>
  <text x="510" y="187" fill="#64748b" font-size="10" font-weight="600" text-anchor="middle">0.6899</text>

  <!-- Tuned RF: 0.6701 (height = 161px -> y = 199) -->
  <rect x="535" y="199" width="40" height="161" rx="3" fill="#3b82f6"/>
  <text x="555" y="191" fill="#1d4ed8" font-size="10" font-weight="600" text-anchor="middle">0.6701</text>

  <!-- Oversampled: 0.6831 (height = 164px -> y = 196) -->
  <rect x="580" y="196" width="40" height="164" rx="3" fill="#f59e0b"/>
  <text x="600" y="188" fill="#b45309" font-size="10" font-weight="600" text-anchor="middle">0.6831</text>

