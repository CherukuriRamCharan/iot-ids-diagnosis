<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 460" width="100%" height="100%" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <!-- Header -->
  <rect x="0" y="0" width="850" height="60" fill="#0f172a"/>
  <text x="30" y="38" fill="#f8fafc" font-size="20" font-weight="700">Figure 5: Public MQTT-UAD Classical Baseline Evaluation (Macro-F1)</text>

  <!-- Subtitle -->
